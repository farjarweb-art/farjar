<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="حقيبة فحص شامل بكل الأجهزة">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f4ee"/><stop offset="1" stop-color="#e9e3d8"/></linearGradient>
<linearGradient id="case" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3a3a"/><stop offset="1" stop-color="#1c1c1c"/></linearGradient>
<linearGradient id="amber" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7bb4d"/><stop offset="1" stop-color="#e0911b"/></linearGradient>
<linearGradient id="foam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2b2b"/><stop offset="1" stop-color="#202020"/></linearGradient>
<linearGradient id="heat" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2533a8"/><stop offset=".4" stop-color="#7b2fbf"/><stop offset=".7" stop-color="#e2423a"/><stop offset="1" stop-color="#f7b733"/></linearGradient>
<linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e4e6e8"/><stop offset="1" stop-color="#9ea3a8"/></linearGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".22"/></filter>
</defs>
<rect width="800" height="600" fill="url(#bg)"/>
<g stroke="#d9d1c3" stroke-width="1" opacity=".7"><path d="M0 120H800M0 240H800M0 360H800M0 480H800M160 0V600M320 0V600M480 0V600M640 0V600"/></g>
<ellipse cx="400" cy="520" rx="300" ry="26" fill="#000" opacity=".12"/>
<g filter="url(#sh)">
  <!-- غطاء الحقيبة -->
  <path d="M130 140h540a24 24 0 0 1 24 24v58H106v-58a24 24 0 0 1 24-24z" fill="url(#case)"/>
  <rect x="330" y="112" width="140" height="34" rx="12" fill="none" stroke="#2a2a2a" stroke-width="14"/>
  <rect x="106" y="214" width="588" height="10" fill="url(#amber)"/>
  <!-- جسم الحقيبة -->
  <rect x="106" y="224" width="588" height="280" rx="22" fill="url(#case)"/>
  <rect x="128" y="244" width="544" height="240" rx="14" fill="url(#foam)"/>
  <rect x="150" y="226" width="40" height="18" rx="4" fill="#9ea3a8"/><rect x="610" y="226" width="40" height="18" rx="4" fill="#9ea3a8"/>
</g>
<!-- الأجهزة داخل الحقيبة -->
<!-- كاميرا حرارية -->
<g transform="translate(152 266)">
  <rect width="118" height="88" rx="12" fill="#333"/><rect x="10" y="10" width="98" height="62" rx="6" fill="url(#heat)"/>
  <circle cx="59" cy="41" r="12" fill="none" stroke="#fff" stroke-width="3"/><rect x="40" y="88" width="38" height="96" rx="10" fill="#2a2a2a"/><rect x="48" y="104" width="22" height="16" rx="4" fill="url(#amber)"/>
</g>
<!-- جهاز رطوبة -->
<g transform="translate(300 270)">
  <rect width="86" height="138" rx="16" fill="#2f2f2f"/><rect x="12" y="14" width="62" height="44" rx="6" fill="#16222c"/>
  <text x="43" y="45" font-family="Arial" font-size="22" font-weight="700" fill="#5ee2a0" text-anchor="middle">18%</text>
  <circle cx="28" cy="84" r="8" fill="url(#amber)"/><circle cx="58" cy="84" r="8" fill="url(#amber)"/><rect x="18" y="106" width="50" height="8" rx="4" fill="#555"/>
</g>
<!-- منظار -->
<g transform="translate(410 268)">
  <rect width="110" height="80" rx="14" fill="#2c2c2c"/><circle cx="55" cy="40" r="26" fill="#111"/><circle cx="55" cy="40" r="16" fill="#1e3a52"/><circle cx="48" cy="34" r="5" fill="#9fd3ff" opacity=".8"/>
  <path d="M110 40c40 0 40 60 80 60" fill="none" stroke="#3a3a3a" stroke-width="10" stroke-linecap="round"/>
</g>
<!-- مطرقة شميدت -->
<g transform="translate(555 270) rotate(8)">
  <rect width="40" height="150" rx="16" fill="#e8e8e8"/><rect x="6" y="20" width="28" height="40" rx="4" fill="#16222c"/><rect x="6" y="80" width="28" height="12" rx="4" fill="url(#amber)"/><rect x="14" y="150" width="12" height="22" rx="4" fill="url(#steel)"/>
</g>
<!-- ملتي ميتر -->
<g transform="translate(160 384)">
  <rect width="84" height="84" rx="12" fill="url(#amber)"/><rect x="12" y="10" width="60" height="26" rx="4" fill="#16222c"/>
  <text x="42" y="30" font-family="Arial" font-size="15" font-weight="700" fill="#7cf0b4" text-anchor="middle">230V</text><circle cx="42" cy="60" r="13" fill="#2a2a2a"/>
</g>
<!-- ميزان ليزر -->
<g transform="translate(268 420)">
  <rect width="74" height="54" rx="10" fill="#2a2a2a"/><rect x="10" y="10" width="54" height="20" rx="4" fill="#0f5f3c"/><circle cx="37" cy="20" r="5" fill="#4dff9a"/>
</g>
<!-- مسطرة التشققات وأداة الزاوية -->
<g transform="translate(372 438)"><rect width="150" height="24" rx="5" fill="url(#steel)"/><g stroke="#555" stroke-width="2"><path d="M12 0v10M26 0v6M40 0v10M54 0v6M68 0v10M82 0v6M96 0v10M110 0v6M124 0v10M138 0v6"/></g></g>
<g transform="translate(372 390)"><rect width="96" height="34" rx="8" fill="#9ea3a8"/><rect x="28" y="6" width="40" height="22" rx="4" fill="#16222c"/><text x="48" y="23" font-family="Arial" font-size="13" font-weight="700" fill="#ffd166" text-anchor="middle">2.4°</text></g>
<!-- كشاف UV -->
<g transform="translate(540 440)"><rect width="110" height="26" rx="10" fill="#222"/><rect x="104" y="-4" width="20" height="34" rx="6" fill="#444"/><circle cx="122" cy="13" r="9" fill="#9b6bff"/></g>
<!-- شارة الباقة -->
<g transform="translate(560 72)" filter="url(#sh)">
  <rect width="190" height="64" rx="32" fill="url(#amber)"/>
  <text x="95" y="42" font-family="Arial" font-size="26" font-weight="800" fill="#1c1c1c" text-anchor="middle">ALL-IN-ONE</text>
</g>
<g transform="translate(70 70)"><circle cx="34" cy="34" r="34" fill="#1c1c1c"/><path d="M18 35l11 11 22-24" fill="none" stroke="#f7bb4d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g>
</svg>
