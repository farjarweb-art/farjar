# Render Blueprint — مجموعة فرجا (Farja Group)
# الاستخدام: Render Dashboard → New → Blueprint → اختر هذا المستودع
# بعد الإنشاء راجع قسم "النشر على Render" في README.md

databases:
  - name: verjar-db
    databaseName: verjar
    user: verjar
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"

services:
  # ───────── الـ API (Express + Prisma) ─────────
  - type: web
    name: verjar-api
    runtime: node
    region: frankfurt
    plan: free
    rootDir: server
    # --include=dev لأن prisma و typescript و tsx مطلوبة وقت البناء والتشغيل
    buildCommand: npm ci --include=dev && npm run build
    # يطبّق الـ migrations ثم ينشئ الأدمن والتصنيفات والخدمات إن لم تكن موجودة (آمن للتكرار) ثم يشغّل السيرفر
    startCommand: npm run start:render
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: verjar-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # رابط الواجهة (للـ CORS) — عدّله إن تغيّر اسم الخدمة أو أضفت دومينًا خاصًا (افصل بفاصلة)
      - key: CLIENT_URL
        value: https://farjarcorp.online,https://www.farjarcorp.online,https://verjar-web-y37y.onrender.com
      - key: PUBLIC_API_URL
        value: https://verjar-api-tpfx.onrender.com
      # الواجهة تمرر /api عبر rewrite فتكون الكوكيز من نفس الدومين
      - key: COOKIE_SAMESITE
        value: lax
      - key: ADMIN_WHATSAPP
        value: "962781400353"
      # حساب الأدمن: يُنشأ عند كل تشغيل إن لم يوجد، وتُحدَّث كلمة مروره إن تغيّرت هنا (farjarweb@gmail.com)
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: إدارة مجموعة فرجا
      # لا تُنشأ بيانات تجريبية في الإنتاج
      - key: SEED_DEMO
        value: "false"
      # cloudinary://<api_key>:<api_secret>@<cloud_name> — مطلوب في الإنتاج (قرص Render مؤقت)
      - key: CLOUDINARY_URL
        sync: false
      - key: CLOUDINARY_FOLDER
        value: verjar
      # link: الموقع يفتح واتساب برسالة جاهزة بعد الإرسال. cloud: إرسال تلقائي عبر Cloud API
      - key: WA_MODE
        value: link
      # البريد (رموز OTP، استعادة كلمة المرور، النشرة): Render المجاني يحجب منافذ SMTP،
      # فاستخدم Brevo عبر HTTPS — BREVO_API_KEY من brevo.com (SMTP & API ← API Keys)،
      # وMAIL_FROM_EMAIL = بريد مرسل موثّق في Brevo (مثل farjarweb@gmail.com)
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM_EMAIL
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      # اختياري: WhatsApp Cloud API من Meta (يُستخدم فقط مع WA_MODE=cloud)
      - key: WA_TOKEN
        sync: false
      - key: WA_PHONE_ID
        sync: false
      - key: WA_API_VERSION
        value: v21.0

  # ───────── الواجهة (React + Vite) ─────────
  - type: web
    name: verjar-web
    runtime: static
    rootDir: client
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      # فارغ = الطلبات تذهب إلى /api على نفس الدومين وتُمرَّر للسيرفر عبر rewrite أدناه
      - key: VITE_API_URL
        value: ""
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      # أمان إضافي: HTTPS دائمًا، وتقييد صلاحيات المتصفح (الموقع يحتاج الموقع الجغرافي فقط)
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: Permissions-Policy
        value: geolocation=(self), camera=(), microphone=(), payment=(), usb=()
      # سياسة المحتوى (CSP): السكربتات من الموقع نفسه فقط (لا سكربت مضمَّن ولا من دومين آخر) — تحدّ من أثر أي ثغرة XSS.
      # الصور: Cloudinary وخرائط OpenStreetMap وملفات الـ API. الإطارات: خريطة Google في صفحة التواصل فقط.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://res.cloudinary.com https://*.tile.openstreetmap.org https://verjar-api-tpfx.onrender.com; media-src 'self' blob: https://res.cloudinary.com https://verjar-api-tpfx.onrender.com; connect-src 'self'; frame-src https://www.google.com https://maps.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
    routes:
      # تمرير الـ API للسيرفر (نفس الدومين → كوكيز httpOnly تعمل على كل المتصفحات)
      # عدّل الرابط إن كان اسم خدمة الـ API مختلفًا
      - type: rewrite
        source: /api/*
        destination: https://verjar-api-tpfx.onrender.com/api/*
      # خريطة الموقع: /sitemap.xml و /sitemap-pages.xml ملفات ثابتة (تفتح فورًا حتى لو السيرفر نائم)،
      # والمنتجات والموردون يولّدها السيرفر
      - type: rewrite
        source: /sitemap-products.xml
        destination: https://verjar-api-tpfx.onrender.com/sitemap-products.xml
      # تطبيق صفحة واحدة: كل المسارات تعرض index.html
      - type: rewrite
        source: /*
        destination: /index.html
